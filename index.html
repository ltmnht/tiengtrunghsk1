const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],V=DATA.vocab,S=DATA.sets;
let store={known:{}};try{Object.assign(store,JSON.parse(localStorage.getItem('hsk1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('hsk1',JSON.stringify(store))}catch(e){}};
const norm=s=>s.toLowerCase().replace(/đ/g,'d').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const pyn=s=>s.toLowerCase().replace(/ü/g,'u').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
const shuffle=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clean=z=>z.replace(/\(.*?\)/g,'').trim();
let voice=null;const pick=()=>{const v=speechSynthesis.getVoices();voice=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null};
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}
function speak(t){return new Promise(r=>{if(!('speechSynthesis' in window))return r();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(t));u.lang='zh-CN';if(voice)u.voice=voice;u.rate=+$('#rate').value;u.onend=u.onerror=()=>r();speechSynthesis.speak(u)})}
$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.toggle('on',x===b));['fc','qz','sp'].forEach(id=>$('#'+id).classList.toggle('hide',id!==b.dataset.t));speechSynthesis.cancel&&speechSynthesis.cancel()});

/* ---------- Flashcard ---------- */
let fc={d:[],i:0,f:false};
function buildFc(){const m=$('#fcFilter').value;let d=m==='unk'?V.filter(v=>!store.known[v.i]):m==='kn'?V.filter(v=>store.known[v.i]):V;fc.d=$('#fcShuf').checked?shuffle(d):d;fc.i=0;fc.f=false;drawFc()}
function drawFc(){const c=fc.d[fc.i],k=Object.values(store.known).filter(Boolean).length;$('#fcBar').style.width=(k/V.length*100)+'%';
 $('#fcInfo').textContent=`Đã nhớ ${k}/${V.length} từ`+(c?` · thẻ ${fc.i+1}/${fc.d.length}`:'');
 if(!c){$('#fcard').innerHTML='<div class="mid">Không có thẻ nào trong nhóm này 🎉</div>';return}
 const zhFront=$('#fcSide').value==='zh';
 const front=zhFront?`<div class="big zh">${c.zh}</div>`:`<div class="mid">${c.vi}</div>`;
 const back=zhFront?`<div class="py">${c.py}</div><div class="mid">${c.vi}</div>`:`<div class="big zh">${c.zh}</div><div class="py">${c.py}</div>`;
 $('#fcard').innerHTML=(fc.f?back:front)+`<span class="tag">${c.pos}${store.known[c.i]?' · ✓ đã nhớ':''}</span>`}
const fcMove=d=>{if(!fc.d.length)return;fc.i=(fc.i+d+fc.d.length)%fc.d.length;fc.f=false;drawFc()};
$('#fcard').onclick=()=>{fc.f=!fc.f;drawFc()};
$('#fcPrev').onclick=()=>fcMove(-1);$('#fcNext').onclick=()=>fcMove(1);
$('#fcSay').onclick=()=>fc.d[fc.i]&&speak(fc.d[fc.i].zh);
const mark=v=>{const c=fc.d[fc.i];if(!c)return;store.known[c.i]=v;save();fcMove(1)};
$('#fcYes').onclick=()=>mark(true);$('#fcNo').onclick=()=>mark(false);
['fcSide','fcFilter','fcShuf'].forEach(id=>$('#'+id).onchange=buildFc);
document.addEventListener('keydown',e=>{if($('#fc').classList.contains('hide')||/INPUT|SELECT/.test(e.target.tagName))return;
 if(e.key===' '){e.preventDefault();$('#fcard').click()}if(e.key==='ArrowRight')fcMove(1);if(e.key==='ArrowLeft')fcMove(-1)});

let q={cur:null,n:0,ok:0,pool:[],done:false};
function qNext(){if(!q.pool.length)q.pool=shuffle(V);q.cur=q.pool.pop();q.done=false;const z=$('#qDir').value==='zh2vi',c=q.cur;
 $('#qAsk').textContent=z?'Hán tự này nghĩa là gì?':'Viết Hán tự hoặc pinyin của từ:';
 $('#qQ').innerHTML=z?`<div class="big zh">${c.zh}</div>`:`<div class="mid">${c.vi}</div><span class="tag">${c.pos}</span>`;
 $('#qIn').value='';$('#qIn').placeholder=z?'Nhập nghĩa tiếng Việt…':'Gõ Hán tự hoặc pinyin (không cần dấu)…';$('#qFb').className='fb hide';$('#qOk').textContent='Kiểm tra';$('#qIn').focus();stat()}
const stat=()=>$('#qStat').textContent=`Đúng ${q.ok}/${q.n}`;
function qCheck(){if(q.done){qNext();return}const a=$('#qIn').value.trim();if(!a)return;const c=q.cur;let ok=false;
 if($('#qDir').value==='zh2vi'){const x=norm(a);ok=c.vi.split(/[,;\/()]/).map(norm).filter(Boolean).some(v=>x===v||(v.length>2&&x.includes(v)))}
 else{const x=a.replace(/\s|'/g,'');ok=c.zh.split(/[()\s]+/).filter(Boolean).includes(x)||c.py.split(/[\/()]+/).map(pyn).filter(Boolean).includes(pyn(x).replace(/v/g,'u'))}
 q.n++;if(ok)q.ok++;q.done=true;stat();const fb=$('#qFb');fb.className='fb '+(ok?'ok':'no');
 fb.innerHTML=(ok?'✅ Chính xác! ':'❌ Chưa đúng. ')+`<br><span class="zh" style="font-size:22px">${c.zh}</span> · ${c.py} · ${c.vi}`;$('#qOk').textContent='Câu tiếp →';speak(c.zh)}
$('#qOk').onclick=qCheck;$('#qIn').onkeydown=e=>{if(e.key==='Enter')qCheck()};
$('#qSkip').onclick=()=>{if(!q.done){q.n++;stat();const c=q.cur;$('#qFb').className='fb no';$('#qFb').innerHTML=`Đáp án: <span class="zh" style="font-size:22px">${c.zh}</span> · ${c.py} · ${c.vi}`;q.done=true;$('#qOk').textContent='Câu tiếp →'}else qNext()};
$('#qSay').onclick=()=>q.cur&&speak(q.cur.zh);$('#qDir').onchange=()=>{q.n=q.ok=0;qNext()};$('#qReset').onclick=()=>{q={cur:null,n:0,ok:0,pool:[],done:false};qNext()};

/* ---------- Pronunciation ---------- */
const D='零一二三四五六七八九',n2z=n=>{n=+n;return n<10?D[n]:n<20?'十'+(n%10?D[n%10]:''):n<100?D[n/10|0]+'十'+(n%10?D[n%10]:''):String(n).split('').map(c=>D[c]).join('')};
const cn=s=>s.replace(/\d+/g,m=>n2z(m)).replace(/[^\u4e00-\u9fff]/g,'');
function lcs(a,b){const m=a.length,n=b.length,t=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)t[i][j]=a[i]===b[j]?t[i+1][j+1]+1:Math.max(t[i+1][j],t[i][j+1]);
 const hit=Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(a[i]===b[j]){hit[i++]=true;j++}else if(t[i+1][j]>=t[i][j+1])i++;else j++}return{hit,n:t[0][0]}}
let sp={heard:-1,hl:-1,si:Math.min(+store.si||0,S.length-1),ti:0,run:0,rec:null};
const cur=()=>S[sp.si].turns[sp.ti];
function draw(){const s=S[sp.si],hide=$('#spHide').checked,t=sp.hl>=0?s.turns[sp.hl]:cur();
 $('#spPos').textContent=`Bài ${sp.si+1}/${S.length} · ${s.name}`;$('#spBar').style.width=((sp.hl>=0?sp.hl:sp.ti)+1)/s.turns.length*100+'%';
 const L=sp.hl>=0?s.turns.length:sp.ti+1;$('#spList').innerHTML=s.turns.slice(0,L).map((x,k)=>`<div class="bub ${(sp.hl>=0?k===sp.hl:k===sp.ti)?'cur':'done'}"><small class="mut">${x.py}</small><div class="zh mid">${x.zh}</div><small class="mut">${x.vi}</small></div>`).join('');
 $('#spVi').textContent=t.vi;$('#spTarget').innerHTML=hide?'<span class="mid">＊＊＊</span>':`<div class="py">${t.py}</div><div class="zh" style="font-size:32px">${t.zh}</div>`;$('#spRes').innerHTML=''}
function halt(){sp.run++;speechSynthesis.cancel();if(sp.rec)try{sp.rec.stop()}catch(e){}}
async function spPlay(replay){halt();const my=sp.run,T=S[sp.si].turns;sp.hl=-1;draw();
 if(replay===true){$('#spStep').textContent='🔊 Nghe lại câu này…';await speak(cur().zh)}
 else if(sp.ti===0&&sp.heard!==sp.si){sp.heard=sp.si;
  for(let k=0;k<T.length;k++){sp.hl=k;draw();$('#spStep').textContent=`🔊 Nghe cả đoạn (${k+1}/${T.length})…`;await speak(T[k].zh);if(my!==sp.run){sp.heard=-1;sp.hl=-1;return}}
  sp.hl=-1;draw();if(T.length>1){$('#spStep').textContent='✅ Đã nghe xong!';$('#spRes').innerHTML=`<p class="fb ok"><b>Đã nghe xong ${T.length} câu.</b><br>Bây giờ bạn đọc lần lượt từng câu, bắt đầu từ câu 1…</p>`;await new Promise(r=>setTimeout(r,3000))}}
 if(my!==sp.run)return;$('#spStep').textContent=T.length>1?`🎤 Đến lượt bạn đọc: câu ${sp.ti+1}/${T.length}`:'🎤 Đến lượt bạn đọc theo';if($('#spAuto').checked)listen()}
function setPos(si,ti){sp.si=(si+S.length)%S.length;sp.ti=ti;store.si=sp.si;save();spPlay()}
function spNext(){const n=S[sp.si].turns.length;sp.ti+1>=n?setPos(sp.si+1,0):setPos(sp.si,sp.ti+1)}
$('#spPrev').onclick=()=>setPos(sp.si-1,0);$('#spNextSet').onclick=()=>setPos(sp.si+1,0);$('#spSkip').onclick=spNext;
$('#spListen').onclick=()=>spPlay(true);$('#mic').onclick=()=>{if(sp.rec){sp.rec.stop();return}halt();listen()};
$('#spHide').onchange=draw;
$$('nav button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.t==='sp')spPlay();else halt()}));
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,res=$('#spRes');
 if(!SR){res.innerHTML='<p class="fb no">Trình duyệt chưa hỗ trợ nhận giọng nói. Hãy mở bằng Chrome, Edge hoặc Safari.</p>';return}
 if(sp.rec)return;const my=sp.run,r=new SR();sp.rec=r;r.lang='zh-CN';r.maxAlternatives=5;r.interimResults=false;
 const mic=$('#mic');mic.classList.add('rec');res.innerHTML='<p class="mut">Đang nghe… hãy đọc theo</p>';
 r.onresult=e=>score([...e.results[0]].map(a=>a.transcript),my);
 r.onerror=e=>{res.innerHTML=`<p class="fb no">${e.error==='not-allowed'||e.error==='service-not-allowed'?'Chưa được cấp quyền micro. Hãy cho phép micro, hoặc mở trang ở tab mới.':e.error==='no-speech'?'Không nghe thấy giọng nói — bấm 🎤 để thử lại.':'Lỗi nhận giọng nói: '+e.error}</p>`};
 r.onend=()=>{sp.rec=null;mic.classList.remove('rec')};try{r.start()}catch(e){sp.rec=null;mic.classList.remove('rec')}}
function score(alts,my){const t=cur(),tg=[...cn(t.zh)];let best=null,heard=alts[0];
 alts.forEach(a=>{const h=[...cn(a)],l=lcs(tg,h);if(!best||l.n>best.n){best=l;heard=a}});
 const pct=Math.round(best.n/tg.length*100),ok=pct>=80,go=ok&&$('#spGo').checked;
 $('#spRes').innerHTML=`<div class="score" style="color:var(--${ok?'ok':'bad'})">${pct}%</div><div>${tg.map((c,k)=>`<span class="ch zh ${best.hit[k]?'g':'r'}">${c}</span>`).join('')}</div>
 <p class="mut">Máy nghe được: <b class="zh">${heard||'(trống)'}</b></p><p>${pct===100?'🎉 Hoàn hảo!':ok?'👍 Tốt! Chỉ sai vài chữ (đỏ).':'Chưa rõ — chữ đỏ là phần máy không nhận ra. Bấm 🎤 để đọc lại.'}${go?' <span class="mut">→ sang câu tiếp…</span>':''}</p>
 `;
 if(go)setTimeout(()=>{if(my===sp.run)spNext()},1800)}
new MutationObserver(()=>{const x=$('#spStep'),s=x.textContent;x.className=s.startsWith('🔊')?'l':s.startsWith('🎤')?'r':s.startsWith('✅')?'d':''}).observe($('#spStep'),{childList:true,characterData:true,subtree:true});
buildFc();qNext();draw();
</script></body></html>
